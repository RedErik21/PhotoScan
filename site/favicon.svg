<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ps-bg" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#2c2488"/>
      <stop offset="48%" stop-color="#4b45d8"/>
      <stop offset="100%" stop-color="#191645"/>
    </linearGradient>
    <radialGradient id="ps-aurora" cx="84%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4b45d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ps-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="ps-lens" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#a5b4fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="ps-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ece9ff"/>
      <stop offset="100%" stop-color="#ffdcb8"/>
    </linearGradient>
    <linearGradient id="ps-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Squircle base -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#ps-bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#ps-aurora)"/>
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="url(#ps-rim)" stroke-width="4"/>

  <!-- Anello lente in vetro satinato -->
  <circle cx="256" cy="256" r="146" fill="url(#ps-lens)" stroke="#ffffff" stroke-opacity="0.36" stroke-width="5"/>
  <circle cx="256" cy="256" r="106" fill="#2e2980" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3.5"/>

  <!-- Monogramma P corsivo stile Apple hello -->
  <path d="M 218 332 C 232 276 248 220 264 186 C 282 174 334 176 334 214 C 334 252 292 272 246 270"
        fill="none" stroke="url(#ps-p)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scintilla AI dorata -->
  <path d="M 366 128 Q 366 154 392 154 Q 366 154 366 180 Q 366 154 340 154 Q 366 154 366 128 Z" fill="url(#ps-star)"/>
</svg>
