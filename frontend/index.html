<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PhotoScan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens-color.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/swal.css">
</head>
<body>
  <div id="fs-splash" class="fs-splash" role="status" aria-live="polite" aria-label="Avvio di PhotoScan">
    <div class="fs-splash__bg" aria-hidden="true"></div>
    <div class="fs-splash__content">
      <h1 class="sr-only">PhotoScan</h1>
      <div class="fs-splash__emblem" aria-hidden="true">
        <span class="fs-splash__ring fs-splash__ring--1"></span>
        <img class="fs-splash__icon" src="icon-192.png" alt="" width="68" height="68">
      </div>
      <div class="fs-splash__wordmark-wrap">
        <svg class="fs-splash__wordmark" viewBox="0 0 680 175" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="fs-hello-grad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="640" y2="0">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#eef0ff" />
              <stop offset="100%" stop-color="#f6e4d2" />
            </linearGradient>
            <linearGradient id="fs-hello-feather" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="86%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <mask id="fs-hello-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="680" height="175">
              <g transform="skewX(-14)">
                <rect class="fs-hello-reveal" x="-80" y="-20" width="900" height="220" fill="url(#fs-hello-feather)" />
              </g>
            </mask>
          </defs>
          <text class="fs-hello-text" x="340" y="122" text-anchor="middle" fill="url(#fs-hello-grad)" mask="url(#fs-hello-mask)">PhotoScan</text>
        </svg>
      </div>
      <p class="fs-splash__sub">I tuoi ricordi, organizzati e ricercabili in locale.</p>
      <div class="fs-splash__footer">
        <div class="fs-splash__progress" aria-hidden="true"><span class="fs-splash__bar"></span></div>
        <div class="fs-splash__pill">
          <span class="fs-splash__dot" aria-hidden="true"></span>
          <p id="fs-splash-status" class="fs-splash__status">Avvio dell’applicazione…</p>
        </div>
      </div>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <noscript>PhotoScan richiede JavaScript.</noscript>
  <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
